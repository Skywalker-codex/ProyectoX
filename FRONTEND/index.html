<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>

    <style>
        * {
            box-sizing: border-box; 
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.10);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        a {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 16px;
        }

        .login {
            background: #2563eb;
            color: white;
        }

        .signin {
            background: #e5e7eb;
            color: #111827;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Bienvenido</h1>

    <a href="login.html" class="login">
        Iniciar sesión
    </a>

    <a href="signin.html" class="signin">
        Crear una cuenta
    </a>
</div>

</body>
</html>
